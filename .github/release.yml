changelog:
  categories:
    - title: "✨ New Features"
      labels:
        - "feature"
        - "enhancement"
    - title: "🐛 Bug Fixes"
      labels:
        - "bug"
        - "fix"
    - title: "📚 Documentation"
      labels:
        - "documentation"
        - "docs"
    - title: "🔧 Maintenance"
      labels:
        - "dependencies"
        - "maintenance"
        - "chore"
  exclude:
    labels:
      - "skip-changelog"
      - "release"
    authors:
      - "dependabot[bot]"
